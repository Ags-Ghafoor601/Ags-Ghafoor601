<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Retrieval pipeline: query fans out to sparse and dense retrieval, merges via Reciprocal Rank Fusion, is re-ranked by a cross-encoder, then passes a grounding gate that either answers with citations or falls back deterministically">
<defs>
<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#4B5563"/></marker>
<pattern id="adots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4B5563" opacity="0.22"/></pattern>
<filter id="aglow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="spine" d="M130 210 C 148 210 150 125 164 125 L 316 125 C 332 125 334 210 350 210 L 662 210 L 742 210 L 742 154 C 742 125 780 125 822 125" fill="none"/>
</defs>
<rect width="1000" height="360" rx="10" fill="#0D1117"/>
<rect width="1000" height="360" rx="10" fill="url(#adots)"/>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
<circle cx="40" cy="40" r="3.5" fill="#22D3EE"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
<text x="54" y="44" font-size="11" letter-spacing="4.5" fill="#22D3EE">RETRIEVAL PIPELINE</text>
<text x="960" y="44" font-size="10" letter-spacing="1.6" fill="#4B5563" text-anchor="end">HYBRID RETRIEVAL &#183; RRF &#183; CROSS-ENCODER RE-RANK</text>
<line x1="40" y1="58" x2="960" y2="58" stroke="#1F2937" stroke-width="1"/>
<path d="M130 210 C 150 210 148 125 162 125" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="0.55s" fill="freeze"/></path>
<path d="M130 210 C 150 210 148 295 162 295" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="0.55s" fill="freeze"/></path>
<path d="M316 125 C 334 125 332 210 348 210" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="0.85s" fill="freeze"/></path>
<path d="M316 295 C 334 295 332 210 348 210" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="0.85s" fill="freeze"/></path>
<path d="M490 210 L 520 210" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="1.05s" fill="freeze"/></path>
<path d="M662 210 L 682 210" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="1.25s" fill="freeze"/></path>
<path d="M742 154 C 742 125 782 125 820 125" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="1.55s" fill="freeze"/></path>
<path d="M742 266 C 742 295 782 295 820 295" fill="none" stroke="#4B5563" stroke-width="1.3" opacity="0" marker-end="url(#ah)"><animate attributeName="opacity" values="0;0.85" dur="0.4s" begin="1.55s" fill="freeze"/></path>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/><text x="784" y="117" font-size="9" letter-spacing="1.4" fill="#22D3EE" text-anchor="middle">YES</text><text x="784" y="313" font-size="9" letter-spacing="1.4" fill="#F87171" text-anchor="middle">NO</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.3s" fill="freeze"/><rect x="18" y="188" width="112" height="44" rx="22" fill="#0D1117" stroke="#22D3EE" stroke-width="1.6"/><text x="74" y="214" font-size="11" font-weight="600" fill="#E6EDF3" text-anchor="middle">User query</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.70s" fill="freeze"/><rect x="164.0" y="96.0" width="152" height="58" rx="7" fill="#0D1117" stroke="#A78BFA" stroke-width="1.6"/><text x="240" y="122" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">Sparse retrieval</text><text x="240" y="138" font-size="9" font-style="italic" fill="#8B949E" text-anchor="middle">keyword &#183; BM25</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.70s" fill="freeze"/><rect x="164.0" y="266.0" width="152" height="58" rx="7" fill="#0D1117" stroke="#A78BFA" stroke-width="1.6"/><text x="240" y="292" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">Dense retrieval</text><text x="240" y="308" font-size="9" font-style="italic" fill="#8B949E" text-anchor="middle">vector embeddings</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.95s" fill="freeze"/><rect x="350" y="181" width="140" height="58" rx="7" fill="#0D1117" stroke="#A78BFA" stroke-width="1.6"/><text x="420" y="206" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">Reciprocal</text><text x="420" y="222" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">Rank Fusion</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.15s" fill="freeze"/><rect x="522" y="181" width="140" height="58" rx="7" fill="#0D1117" stroke="#A78BFA" stroke-width="1.6"/><text x="592" y="206" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">Cross-encoder</text><text x="592" y="222" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">re-ranking</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.35s" fill="freeze"/><path d="M742 154 L 800 210 L 742 266 L 684 210 Z" fill="#0D1117" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round"/><text x="742" y="206" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">Grounded in</text><text x="742" y="222" font-size="11.5" font-weight="600" fill="#E6EDF3" text-anchor="middle">a source?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.75s" fill="freeze"/><rect x="822" y="99" width="168" height="52" rx="7" fill="#0D1117" stroke="#22D3EE" stroke-width="1.8"/><text x="906" y="129" font-size="11.5" font-weight="600" fill="#22D3EE" text-anchor="middle">Answer + citations</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.75s" fill="freeze"/><rect x="822" y="266" width="168" height="58" rx="7" fill="#0D1117" stroke="#F87171" stroke-width="1.8"/><text x="906" y="292" font-size="10.5" font-weight="600" fill="#F87171" text-anchor="middle">Deterministic fallback</text><text x="906" y="308" font-size="8.5" font-style="italic" fill="#8B949E" text-anchor="middle">degrade loudly, never guess</text></g>
<circle r="3.2" fill="#22D3EE" opacity="0" filter="url(#aglow)"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="4.5s" begin="2.1s" repeatCount="indefinite"/><animateMotion dur="4.5s" begin="2.1s" repeatCount="indefinite"><mpath href="#spine"/></animateMotion></circle>
</g>
<rect x="0.5" y="0.5" width="999" height="359" rx="10" fill="none" stroke="#1F2937" stroke-width="1"/>
</svg>