name: Refresh Live Telemetry

on:
  schedule:
    - cron: "17 4 * * *"      # every day at 04:17 UTC
  workflow_dispatch:           # manual run button in the Actions tab
  push:
    branches: [main]
    paths:
      - "tools/telemetry.py"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render telemetry panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Ags-Ghafoor601
        run: python tools/telemetry.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-*.svg assets/contributions-*.svg
          if git diff --staged --quiet; then
            echo "no telemetry change"
          else
            git commit -m "chore: refresh live telemetry [skip ci]"
            git push
          fi
