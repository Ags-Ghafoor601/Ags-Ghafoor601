name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Ags-Ghafoor601
          outputs: |
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#161B22,#0E7490,#0891B2,#22D3EE,#67E8F9
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#EAEEF2,#A5E4F0,#38BDF8,#0891B2,#075985

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
